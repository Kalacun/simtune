[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simtune"
version = "0.1.0"
description = "Capability-aware CLI for profiling, tuning, and comparing command workloads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simtune Contributors" }]
keywords = ["profiling", "benchmarking", "performance", "linux", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Kalacun/simtune"
Issues = "https://github.com/Kalacun/simtune/issues"
Documentation = "https://github.com/Kalacun/simtune/tree/main/docs"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
rich = ["rich>=13.0"]
dev = ["pytest>=8", "build>=1", "ruff>=0.11,<1"]

[project.scripts]
simtune = "simtune.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simtune*"]

[tool.setuptools]
package-data = { "simtune" = ["py.typed"] }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["reports", "runs", "zagovor"]
target-version = "py311"
line-length = 100
include = ["simtune/**/*.py", "tests/**/*.py", "examples/**/*.py", "pyproject.toml", "setup.py", "distribution/*.py", "docs/implementation/release-plan/r06/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
